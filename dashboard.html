<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed-in Users Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signed-in-dashboard">
        <h2>Signed-in Users Dashboard</h2>
        <p>Total Signed-in: <span id="totalCount">0</span></p>
        <div class="dashboard-table-container">
            <table id="signedInUsersTable">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Trade</th>
                        <th>Full Name</th>
                        <th>Safety Induction</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Signed-in users will be displayed here dynamically by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
