<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h2>Sign In</h2>
        <form>

            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" required>
            </div>
            <div class="form-group">
                <label for="roleTrade">Role/Trade:</label>
                <select id="roleTrade" name="roleTrade" required>
                    <option value="">Select Role/Trade</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Siding">Siding</option>
                    <option value="Drywall/Mud and Tape">Drywall/Mud and Tape</option>
                    <option value="Framing">Framing</option>
                    <option value="Finish Carpentry">Finish Carpentry</option>
                    <option value="Roofing/Shingles">Roofing/Shingles</option>
                    <option value="Cribbing">Cribbing</option>
                    <option value="Excavation">Excavation</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="safetyInduction" name="safetyInduction" required>
                <label for="safetyInduction">I confirm I have completed site orientation.</label>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="dashboard-link">
            <p>View <a href="./dashboard.html">Signed-in Users Dashboard</a></p>
        </div>
    </div>
    <!-- Firebase Config -->
    <script src="./config/firebase-config.js"></script>
    <!-- Main App -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
